# ============================
# ? APPLICATION CONFIGURATION
# ============================
spring.application.name=kartikey
server.port=${PORT:8080}

# ============================
# ?? H2 DATABASE CONFIGURATION (PERSISTENT FILE)
# ============================
# Absolute path use karo taki redeploy par data na jaye.
spring.datasource.url=jdbc:h2:file:./kartikey-data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true

# ============================
# ? JPA / HIBERNATE CONFIGURATION
# ============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ============================
# ? SQL INIT
# ============================
spring.sql.init.mode=always

# ============================
# ? OAUTH2 CONFIGURATION
# ============================
# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============================
# ? JWT CONFIGURATION
# ============================
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# ============================
# ? FRONTEND REDIRECT CONFIGURATION
# ============================
app.frontend.url=${FRONTEND_URL}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}

# ============================
# ? EMAIL CONFIGURATION
# ============================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

# ============================
# ? LOGGING CONFIGURATION
# ============================
logging.level.com.kartikey=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
